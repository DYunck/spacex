name: Update SPCX signals

on:
  schedule:
    # Every hour at :40 past, 13:40–21:40 UTC, Monday–Friday.
    # Covers US market hours (9:30–4:00 ET) all year, plus one after-close run for the daily summary.
    - cron: "40 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, intraday or summary"
        default: auto
  push:
    branches: [main]
    paths: ["app/**", "docs/*.html", "docs/*.js", "docs/*.css", "config.yaml", "data/**", "requirements.txt"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: spcx-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data, analyze, send alerts
        env:
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m app.run --mode "${{ github.event.inputs.mode || 'auto' }}"

      - name: Save history (alerts, IV history) back to the repo
        run: |
          git config user.name "spcx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Update SPCX data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -X ours origin main || true
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
